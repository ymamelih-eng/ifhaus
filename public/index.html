<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ifHaus Asistan Demo</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f4;color:#171717;min-height:100vh;display:grid;place-items:center}
    .wrap{width:min(920px,94vw);display:grid;grid-template-columns:1fr 420px;gap:48px;align-items:center}.brand{font-family:Georgia,serif;font-size:64px;line-height:1}.brand span{color:#c65f3f}.lead{max-width:520px;font-size:20px;line-height:1.5;color:#525252}
    .chat{background:white;border:1px solid #e7e4df;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.08);overflow:hidden;height:660px;display:flex;flex-direction:column}.head{padding:20px 22px;border-bottom:1px solid #eee}.head b{font-family:Georgia,serif;font-size:22px}.head small{display:block;margin-top:4px;color:#777}.msgs{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}.m{max-width:84%;padding:12px 14px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap}.bot{background:#f4f1ed;align-self:flex-start}.user{background:#1f1f1f;color:#fff;align-self:flex-end}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #eee}.composer input{flex:1;border:1px solid #ddd;border-radius:14px;padding:13px 14px;font-size:15px;outline:none}.composer button{border:0;border-radius:14px;background:#c65f3f;color:#fff;padding:0 18px;font-weight:700;cursor:pointer}
    @media(max-width:800px){.wrap{grid-template-columns:1fr;gap:20px}.brand{font-size:46px}.intro{padding:30px 4px 0}.chat{height:70vh}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="intro"><div class="brand"><span>if</span>Haus</div><p class="lead">Modeller, arsa, süreç ve fiyatlandırma hakkında kısa bilgi alın.</p></section>
    <section class="chat"><div class="head"><b>ifHaus Asistan</b><small>Size nasıl yardımcı olabiliriz?</small></div><div class="msgs" id="msgs"><div class="m bot">Merhaba. ifHaus modelleri, arsanız ve süreç hakkında yardımcı olabilirim. Ne öğrenmek istersiniz?</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Mesajınızı yazın…"><button>Gönder</button></form></section>
  </main>
<script>
let sessionId = localStorage.getItem('ifhausSessionId') || '';
const msgs=document.getElementById('msgs'), form=document.getElementById('form'), input=document.getElementById('input');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';add('Yazıyor…','bot');const typing=msgs.lastChild;try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,sessionId,source:'web'})});const j=await r.json();typing.remove();if(j.sessionId){sessionId=j.sessionId;localStorage.setItem('ifhausSessionId',sessionId)}add(j.reply||'Bir sorun oluştu.','bot')}catch{typing.remove();add('Şu anda bağlantı kurulamadı. Lütfen tekrar deneyin.','bot')}})
</script>
</body>
</html>
